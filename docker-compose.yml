# Local development only. The API is added to this file in a later phase.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tickecheck-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Read from the .env file (not committed). See .env.example.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create a .env file from .env.example}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
