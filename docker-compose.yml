# Local development only.
#   docker compose up -d sqlserver   -> only the database (run the API with "dotnet run")
#   docker compose up -d --build     -> database + API + frontend on http://localhost:8080
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tickecheck-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Read from the .env file (not committed). See .env.example.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create a .env file from .env.example}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: tickecheck-api
    depends_on:
      sqlserver:
        # Wait until SQL Server accepts connections, not just until its container starts.
        condition: service_healthy
    environment:
      # Inside the compose network the database is reached by its service name.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Tickecheck;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Create a .env file from .env.example}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
